---
# ============================================================================
#  Project 2 — your hardening playbook.   (ansible-pull runs THIS file)
#
#  ansible-pull looks for a file named local.yml at the root of your git repo,
#  and runs it ON the box itself (no SSH, no inventory needed).
#
#  To apply it on your box:
#     sudo ansible-pull -U https://github.com/<you>/<your-repo>.git
#
#  Goal: bring a broken box into the hardened target state (see the portal for
#  the 14 tasks and exactly what each one checks). Your playbook must be
#  IDEMPOTENT — running it a second time should report  changed=0.
# ============================================================================

- name: Project 2 hardening
  hosts: localhost
  connection: local
  become: true

  tasks:
    # A1 - SSH access
    - name: Disable root login and password authentication for SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/99-course.conf
        regexp: '^{{ item }}\s+'
        line: '{{ item }} no'
      loop:
        - PermitRootLogin
        - PasswordAuthentication
      register: ssh_settings

    - name: Validate the SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Reload SSH after a configuration change
      ansible.builtin.service:
        name: ssh
        state: reloaded
      when: ssh_settings.changed

    # A2 - Host firewall
    - name: Allow incoming SSH on TCP port 22
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Deny incoming connections by default
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Enable the firewall
      community.general.ufw:
        state: enabled

    # A3 - Scheduled jobs
    - name: Remove the unauthorized apt-mirror cron job
      ansible.builtin.file:
        path: /etc/cron.d/apt-mirror
        state: absent

    # A4 - Listening services
    - name: Stop and disable the debugshell service
      ansible.builtin.service:
        name: debugshell.service
        state: stopped
        enabled: false

    # A5 - Brute-force protection
    - name: Install Fail2ban
      ansible.builtin.package:
        name: fail2ban
        state: present

    - name: Enable the Fail2ban SSH jail
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: "0644"
        content: |
          [sshd]
          enabled = true
          backend = systemd
      register: ssh_jail_config

    - name: Enable Fail2ban and apply its configuration
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: "{{ 'restarted' if ssh_jail_config.changed else 'started' }}"

    # A6 - Directory permissions
    - name: Set permissions on the uploads directory
      ansible.builtin.file:
        path: /srv/app/uploads
        state: directory
        owner: root
        group: root
        mode: "0755"

    # B1 - Unauthorized admin
    - name: Lock monitor and remove its supplementary groups
      ansible.builtin.user:
        name: monitor
        password_lock: true
        groups: ""
        append: false

    # B2 - Passwordless sudo
    - name: Require a password for sudo on the ubuntu account
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/90-cloud-init-users
        regexp: '^\s*ubuntu\s+ALL\s*='
        line: 'ubuntu ALL=(ALL) PASSWD: ALL'
        validate: '/usr/sbin/visudo -cf %s'

    - name: Remove the unauthorized passwordless sudo rule
      ansible.builtin.file:
        path: /etc/sudoers.d/90-course-nopasswd
        state: absent

    # B3 - SUID binary
    - name: Remove the SUID bit from netcheck
      ansible.builtin.file:
        path: /usr/local/bin/netcheck
        state: file
        mode: "u-s"

    # B4 - Empty password
    - name: Lock the guestsvc password
      ansible.builtin.user:
        name: guestsvc
        password_lock: true

    # B5 - Exposed credentials
    - name: Restrict access to the application credentials file
      ansible.builtin.file:
        path: /opt/app/config.yml
        state: file
        mode: "0600"

    # Database module dependency
    - name: Install the Python driver for MySQL
      ansible.builtin.package:
        name: python3-pymysql
        state: present

    # C1 - Webapp account
    - name: Restrict webapp privileges to its own database
      community.mysql.mysql_user:
        name: webapp
        host: "%"
        priv: "shopdb.*:SELECT,INSERT,UPDATE,DELETE"
        append_privs: false
        login_unix_socket: /var/run/mysqld/mysqld.sock
        state: present

    # C2 - Reporting account
    - name: Give reporting read-only access to shopdb
      community.mysql.mysql_user:
        name: reporting
        host: "%"
        priv: "shopdb.*:SELECT"
        append_privs: false
        login_unix_socket: /var/run/mysqld/mysqld.sock
        state: present

    # C3 - Database access hosts
    - name: Remove the remote root and anonymous local MySQL accounts
      community.mysql.mysql_user:
        name: "{{ item.name }}"
        host: "{{ item.host }}"
        state: absent
        login_unix_socket: /var/run/mysqld/mysqld.sock
      loop:
        - { name: "root", host: "%" }
        - { name: "", host: "localhost" }
